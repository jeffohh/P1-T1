behaviors:
  TankAI:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 2048  # Larger batch size is good for stable learning with many environments
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 0.005       # Increase entropy slightly to encourage exploration across all envs
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      
    network_settings:
      normalize: true
      hidden_units: 512  # Increase network size for more complex behavior
      num_layers: 3      # Add a layer for deeper pattern recognition
      vis_encode_type: simple
      
      memory:
        sequence_length: 64
        memory_size: 256 # Memory size can stay at 256, it's often sufficient
      
    reward_signals:
      extrinsic:
        gamma: 0.995     # Increase gamma slightly to encourage more long-term planning
        strength: 1.0
      # Curiosity can be helpful, but let's rely on the extrinsic signal for now
      # You can re-enable it later if the agent gets stuck
      # curiosity: ...
        
    max_steps: 10000000 # With parallel envs, you can aim for higher step counts
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 200000